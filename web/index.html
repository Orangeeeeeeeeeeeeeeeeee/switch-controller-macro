<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch 手柄</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#1a1a1a;color:#bbb;font-size:13px}
.wrap{padding:10px;max-width:100%}
.header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.header h1{font-size:15px;font-weight:600;color:#eee}
.status{padding:3px 8px;border-radius:3px;font-size:11px}
.status.ok{background:#1a3a1a;color:#5f5;border:1px solid #2a2}
.status.err{background:#3a1a1a;color:#f55;border:1px solid #a22}
.status.wait{background:#3a3a1a;color:#fc5;border:1px solid #aa2}
.cols{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:300px}
.col-narrow{flex:0 0 320px}
.panel{background:#242424;border:1px solid #333;border-radius:4px;padding:10px;margin-bottom:10px}
.panel-title{font-size:11px;color:#777;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
.row label{font-size:11px;color:#777;min-width:40px}
button{background:#333;color:#bbb;border:1px solid #444;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:12px}
button:hover{background:#3a3a3a}
button.active{background:#284;border-color:#3a5;color:#7d9}
button.rec-active{background:#622;border-color:#844}
input[type=number]{width:48px;padding:4px;background:#1a1a1a;border:1px solid #444;border-radius:3px;color:#ddd;font-size:12px;text-align:center}
.controller{max-width:580px;margin:0 auto}
.shoulders{display:flex;justify-content:space-between;margin-bottom:20px;padding:0 20px}
.shoulders>div{display:flex;gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:0 10px}
.middle-btns{display:flex;flex-direction:row;gap:16px;align-items:center;justify-content:center;padding:0 30px}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 10px}
.bind-area{margin-top:10px}
.bind-area.hidden{display:none}
.switch-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:8px}
.switch-grid button{padding:4px;font-size:10px}
.switch-grid button.selected{background:#36a;color:#fff}
.kb-layout{display:flex;flex-direction:column;gap:3px;align-items:center}
.kb-row{display:flex;gap:3px}
.kb-key{width:30px;height:30px;background:#2a2a2a;border:1px solid #444;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;position:relative}
.kb-key .bl{font-size:7px;color:#0a6;position:absolute;bottom:1px}
.kb-key.wide{width:60px}
.gp-layout{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gp-btn{width:44px;height:44px;background:#2a2a2a;border:1px solid #444;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;position:relative}
.gp-btn .bl{font-size:7px;color:#0a6}
.stick{width:120px;height:120px;border:1px solid #444;border-radius:50%;position:relative;background:#1a1a1a;touch-action:none}
.knob{width:36px;height:36px;background:#36a;border-radius:50%;position:absolute;top:42px;left:42px}
.stick-area{text-align:center}
.stick-area button{margin-top:6px;font-size:11px;padding:4px 10px}
.dpad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:4px}
.dpad button{padding:0;font-size:16px;background:#2a2a2a}
.abxy{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:4px}
.abxy button{padding:0;font-size:16px;background:#2a2a2a}
.map-table{max-height:200px;overflow-y:auto}
.map-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #2a2a2a}
.map-item span{min-width:70px;font-family:monospace;font-size:11px}
.map-item select{background:#1a1a1a;border:1px solid #444;color:#ddd;border-radius:3px;padding:3px;font-size:11px}
.map-item button{padding:2px 6px;font-size:10px;background:#3a1a1a}
.macro-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:#1e1e1e;border-radius:3px;margin-bottom:3px;font-size:12px}
.macro-item button{padding:2px 6px;font-size:10px;background:#3a1a1a}
textarea{width:100%;height:80px;background:#1a1a1a;border:1px solid #444;border-radius:3px;color:#999;font-family:monospace;font-size:10px;padding:6px;resize:vertical}
details summary{cursor:pointer;color:#777;font-size:11px;padding:4px 0}
@media(max-width:640px){.cols{flex-direction:column}.col-narrow{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <h1>Switch 手柄控制</h1>
  <span class="status wait" id="status">连接中</span>
</div>

<div class="panel">
  <div class="row">
    <label>模式</label>
    <button id="m-virtual" class="active" onclick="setMode('virtual')">虚拟</button>
    <button id="m-keyboard" onclick="setMode('keyboard')">键盘</button>
    <button id="m-gamepad" onclick="setMode('gamepad')">手柄</button>
    <button id="m-pro2" onclick="setMode('pro2')">Pro2</button>
    <span style="flex:1"></span>
    <button id="rec-btn" class="rec-active" onclick="toggleRec()">录制</button>
    <button onclick="playMacro()">回放</button>
    <button onclick="stopAll()">停止</button>
    <button onclick="connectSwitch()">连接Switch</button>
    <button onclick="disconnectSwitch()">断开</button>
    <button onclick="reconnect()">重连</button>
    <button id="mouse-lock-btn" onclick="toggleMouseLock()">鼠标锁定</button>
  </div>
  <div class="row">
    <label>循环</label><input id="loops" type="number" value="1" min="0">
    <label>间隔</label><input id="interval" type="number" value="0" min="0">s
    <label>鼠标灵敏度</label><input id="mouseSens" type="number" value="0.005" step="0.001" min="0" style="width:60px">
  </div>
  <div class="row">
    <button onclick="saveMacro()">存宏</button>
    <button onclick="loadMacro()">读宏</button>
    <button onclick="clearMacro()">清空</button>
    <span id="rec-count" style="color:#666">0 事件</span>
  </div>
</div>

<div class="cols">
<div class="col">
  <div class="panel">
    <div class="panel-title">手柄</div>
    <div class="controller">
      <div class="shoulders">
        <div><button data-sw="l" onmousedown="handleBtn(\'l\',1)" onmouseup="handleBtn('l',0)">L</button><button data-sw="zl" onmousedown="handleBtn(\'zl\',1)" onmouseup="handleBtn('zl',0)">ZL</button></div>
        <div><button data-sw="r" onmousedown="handleBtn(\'r\',1)" onmouseup="handleBtn('r',0)">R</button><button data-sw="zr" onmousedown="handleBtn(\'zr\',1)" onmouseup="handleBtn('zr',0)">ZR</button></div>
      </div>
      <div class="top-row">
        <div class="stick-area">
          <div class="stick" id="lstick"><div class="knob" id="lknob"></div></div>
          <button data-sw="l_stick" onmousedown="handleBtn(\'l_stick\',1)" onmouseup="handleBtn('l_stick',0)">L3</button>
          <div id="lstick-bind" style="font-size:8px;color:#0a6;margin-top:2px"></div>
          <button onclick="bindStick('left')" style="font-size:9px;padding:2px 6px;margin-top:2px">换绑</button>
        </div>
        <div class="middle-btns">
          <button data-sw="minus" onmousedown="handleBtn(\'minus\',1)" onmouseup="handleBtn('minus',0)">−</button>
          <button data-sw="capture" onmousedown="handleBtn(\'capture\',1)" onmouseup="handleBtn('capture',0)">截图</button>
          <button data-sw="plus" onmousedown="handleBtn(\'plus\',1)" onmouseup="handleBtn('plus',0)">+</button>
          <button data-sw="home" onmousedown="handleBtn(\'home\',1)" onmouseup="handleBtn('home',0)">Home</button>
        </div>
        <div class="abxy">
          <div></div><button data-sw="x" onmousedown="handleBtn(\'x\',1)" onmouseup="handleBtn('x',0)">X</button><div></div>
          <button data-sw="y" onmousedown="handleBtn(\'y\',1)" onmouseup="handleBtn('y',0)">Y</button><div></div><button data-sw="a" onmousedown="handleBtn(\'a\',1)" onmouseup="handleBtn('a',0)">A</button>
          <div></div><button data-sw="b" onmousedown="handleBtn(\'b\',1)" onmouseup="handleBtn('b',0)">B</button><div></div>
        </div>
      </div>
      <div class="bottom-row">
        <div class="dpad">
          <div></div><button data-sw="up" onmousedown="handleBtn(\'up\',1)" onmouseup="handleBtn('up',0)" ontouchstart="handleBtn('up',1)" ontouchend="handleBtn('up',0)">↑</button><div></div>
          <button data-sw="left" onmousedown="handleBtn(\'left\',1)" onmouseup="handleBtn('left',0)" ontouchstart="handleBtn('left',1)" ontouchend="handleBtn('left',0)">←</button><div></div><button data-sw="right" onmousedown="handleBtn(\'right\',1)" onmouseup="handleBtn('right',0)" ontouchstart="handleBtn('right',1)" ontouchend="handleBtn('right',0)">→</button>
          <div></div><button data-sw="down" onmousedown="handleBtn(\'down\',1)" onmouseup="handleBtn('down',0)" ontouchstart="handleBtn('down',1)" ontouchend="handleBtn('down',0)">↓</button><div></div>
        </div>
        <div class="stick-area">
          <div class="stick" id="rstick"><div class="knob" id="rknob"></div></div>
          <button data-sw="r_stick" onmousedown="handleBtn(\'r_stick\',1)" onmouseup="handleBtn('r_stick',0)">R3</button>
          <div id="rstick-bind" style="font-size:8px;color:#0a6;margin-top:2px"></div>
          <button onclick="bindStick('right')" style="font-size:9px;padding:2px 6px;margin-top:2px">换绑</button>
        </div>
      </div>
    </div>
    <div id="bind-hint" style="margin-top:8px;padding:6px 10px;background:#1a1a1a;border:1px solid #333;border-radius:4px;font-size:11px;color:#888;line-height:1.6">
      <b style="color:#aaa">绑定说明</b><br>
      <span id="hint-virtual">虚拟模式:点击按键直接发送到 Switch</span>
      <span id="hint-keyboard" style="display:none">键盘模式:点 Switch 按键高亮 -> 按键盘键绑定。WASD=左摇杆 IJKL=右摇杆(或换绑)。鼠标锁定后移动=右摇杆</span>
      <span id="hint-gamepad" style="display:none">手柄模式:点 Switch 按键高亮 -> 按手柄按钮绑定。摇杆点"换绑"后转一圈自动检测</span>
      <span id="hint-pro2" style="display:none">Pro2 模式:Switch 2 Pro 手柄(USB 连 PC)输入直接转发到 Switch,无需映射绑定</span>
    </div>
  </div>
</div>

<div class="col col-narrow">
  <div class="panel">
    <div class="panel-title">宏列表 <span id="list-count" style="color:#666">列表0</span></div>
    <div class="row">
      <label>宏间隔</label><input id="macroInterval" type="number" value="0" min="0">s
      <label>循环间隔</label><input id="loopInterval" type="number" value="0" min="0">s
    </div>
    <div class="map-table" id="macro-list"></div>
    <div class="row" style="margin-top:6px">
      <button onclick="addToList()">加入列表</button>
      <button onclick="clearList()">清空列表</button>
      <button onclick="playList()">回放列表</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">键盘映射 <button onclick="addKeyMap()" style="float:right;padding:2px 6px;font-size:10px">添加</button></div>
    <div class="map-table" id="keymap-table"></div>
  </div>
  <div class="panel">
    <div class="panel-title">手柄映射 <button onclick="addGpMap()" style="float:right;padding:2px 6px;font-size:10px">添加</button></div>
    <div class="map-table" id="gpmap-table"></div>
  </div>
  <details><summary>JSON 高级</summary>
    <textarea id="mapcfg">{
  "keyboard": {"KeyA":"a","KeyS":"b","KeyZ":"y","KeyX":"x","KeyJ":"left","KeyL":"right","KeyI":"up","KeyK":"down","KeyU":"l","KeyO":"r","KeyQ":"zl","KeyE":"zr","Enter":"plus","Backspace":"minus","Space":"home","KeyC":"capture"},
  "gamepad": {"0":"b","1":"a","2":"y","3":"x","4":"l","5":"r","6":"zl","7":"zr","8":"minus","9":"plus","10":"l_stick","11":"r_stick","12":"up","13":"down","14":"left","15":"right"}
}</textarea>
    <button onclick="syncMaps()" style="margin-top:4px">从JSON同步</button>
  </details>
</div>
</div>
</div>

<script>
let ws=null,mode='virtual',recording=false,macro=[],recT0=0;
let keyMap={},gpMap={},gpPrev={};
let macroList=[];
let stickKeyMap={left:{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},right:{up:'KeyI',down:'KeyK',left:'KeyJ',right:'KeyL'}};
let pressedKeys={};
let mouseStick={h:0,v:0};
let mouseLocked=false;
function mouseLoop(){
  if(mode==='keyboard'&&mouseLocked){
    if(Math.abs(mouseStick.h)>0.01||Math.abs(mouseStick.v)>0.01){
      mouseStick.h*=0.85;mouseStick.v*=0.85;
      send({type:'stick',stick:stickMouse,h:mouseStick.h,v:mouseStick.v});
    }else if(mouseStick.h!==0||mouseStick.v!==0){
      mouseStick.h=0;mouseStick.v=0;
      send({type:'stick',stick:stickMouse,h:0,v:0});
    }
  }
  requestAnimationFrame(mouseLoop);
}
mouseLoop();
document.addEventListener('mousemove',e=>{
  if(mode!=='keyboard'||!mouseLocked)return;
  var sens=parseFloat(document.getElementById('mouseSens').value)||0.005;
  mouseStick.h=Math.max(-1,Math.min(1,mouseStick.h+e.movementX*sens));
  mouseStick.v=Math.max(-1,Math.min(1,mouseStick.v-e.movementY*sens));
  send({type:'stick',stick:stickMouse,h:mouseStick.h,v:mouseStick.v});
});
document.addEventListener('pointerlockchange',()=>{
  mouseLocked=(document.pointerLockElement===document.body);
  var btn=document.getElementById('mouse-lock-btn');
  if(btn)btn.textContent=mouseLocked?'鼠标解锁':'鼠标锁定';
});
function updateStickFromKeys(){
  for(var sk in stickKeyMap){if(stickMouse===sk)continue;
    var h=0,v=0;
    if(pressedKeys[stickKeyMap[sk].left])h-=1;
    if(pressedKeys[stickKeyMap[sk].right])h+=1;
    if(pressedKeys[stickKeyMap[sk].up])v+=1;
    if(pressedKeys[stickKeyMap[sk].down])v-=1;
    var mag=Math.sqrt(h*h+v*v);
    if(mag>1){h/=mag;v/=mag;}
    send({type:'stick',stick:sk,h:h,v:v});
  }
}
const SWITCH_BTNS=['a','b','x','y','l','r','zl','zr','plus','minus','home','capture','up','down','left','right','l_stick','r_stick'];

function connect(){const h=location.hostname||'127.0.0.1';ws=new WebSocket('ws://'+h+':8080/ws');ws.onopen=()=>{send({type:'pro2',enabled:mode==='pro2'});send({type:'get_status'});};ws.onmessage=(e)=>{var d;try{d=JSON.parse(e.data);}catch(err){return;}if(d.type==='status'){var s=document.getElementById('status');s.textContent=d.msg||d.state;s.className='status '+(d.state==='connected'?'ok':d.state==='disconnected'?'err':'wait');}};ws.onclose=()=>{const s=document.getElementById('status');s.textContent='断开,重连';s.className='status err';setTimeout(connect,2000);};ws.onerror=()=>{};}
connect();
function send(ev){if(ws&&ws.readyState===1)ws.send(JSON.stringify(ev));if(recording)macro.push({t:performance.now()-recT0,ev:ev});document.getElementById('rec-count').textContent=macro.length+' 事件';}
function btn(n,p){send({type:'button',name:n,pressed:!!p});}
let pendingBind=null;
function selectSwitchBtn(b){pendingBind=b;renderBindings();}
function handleBtn(name,pressed){if(mode==='virtual'){btn(name,pressed);}else if(pressed){selectSwitchBtn(name);}}
function renderBindings(){document.querySelectorAll('[data-sw]').forEach(function(el){var name=el.dataset.sw;var bind='';if(mode==='keyboard'){for(var k in keyMap){if(keyMap[k]===name){bind=k;break;}}}else if(mode==='gamepad'){for(var k in gpMap){if(gpMap[k]===name){bind=k;break;}}}var labels={'up':'↑','down':'↓','left':'←','right':'→','minus':'−','plus':'+','l_stick':'L3','r_stick':'R3'};var lbl=labels[name]||name;el.innerHTML=lbl+(bind?' <span style="font-size:7px;color:#0a6">'+bind+'</span>':'');if(pendingBind===name){el.style.borderColor='#36a';el.style.color='#5af';}else{el.style.borderColor='';el.style.color='';}});}
renderBindings();
let stickMouse='right';
let stickAxes={left:{x:0,y:1},right:{x:2,y:3}};
let listeningStick=null;
function bindStick(side){
  if(mode==='gamepad'){listeningStick=side;var el=document.getElementById(side+'stick-bind');if(el)el.textContent='转圈绑定中...';return;}
  var c=prompt(side+'摇杆:输入 keyboard 或 mouse',side==='right'?'mouse':'keyboard');
  if(c==='mouse'){stickMouse=side;}
  else if(c==='keyboard'){if(stickMouse===side)stickMouse=null;var dirs=['up','down','left','right'];var defs=['W','S','A','D'];for(var i=0;i<4;i++){var k=prompt(side+' '+dirs[i]+'键(如Key'+defs[i]+')','Key'+defs[i]);if(k)stickKeyMap[side][dirs[i]]=k;}}
  renderStickBinds();
}
function renderStickBinds(){
  ['left','right'].forEach(function(side){
    var el=document.getElementById(side+'stick-bind');
    if(!el)return;
    if(stickMouse===side){el.textContent='鼠标';}else if(mode==='gamepad'){var a=stickAxes[side];el.textContent='axes'+a.x+'/'+a.y;}else{var m=stickKeyMap[side];el.textContent=m.up+'/'+m.left+'/'+m.down+'/'+m.right;}
  });
}
renderStickBinds();
function toggleMouseLock(){if(document.pointerLockElement===document.body){document.exitPointerLock();}else{document.body.requestPointerLock();}}
function setMode(m){
  mode=m;
  if(m!=='keyboard'){if(mouseLocked)document.exitPointerLock();mouseStick.h=0;mouseStick.v=0;send({type:'stick',stick:stickMouse,h:0,v:0});}
  send({type:'pro2',enabled:m==='pro2'});
  document.querySelectorAll('[id^=m-]').forEach(function(b){b.classList.remove('active');});
  document.getElementById('m-'+m).classList.add('active');
  renderBindings();
  renderStickBinds();
  ['virtual','keyboard','gamepad','pro2'].forEach(function(hm){
    var el=document.getElementById('hint-'+hm);
    if(el)el.style.display=hm===m?'block':'none';
  });
}
function toggleRec(){recording=!recording;const b=document.getElementById('rec-btn');b.classList.toggle('rec-active',!recording);b.textContent=recording?'停止录':'录制';if(recording){macro=[];recT0=performance.now();}}
function playMacro(){if(!macro.length){alert('宏为空');return;}let l=parseInt(document.getElementById('loops').value);if(isNaN(l))l=1;let i=parseFloat(document.getElementById('interval').value)||0;if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'play',macro:macro,loops:l,interval:i}));}
function playList(){if(!macroList.length){alert('列表空');return;}let l=parseInt(document.getElementById('loops').value);if(isNaN(l))l=1;let mi=parseFloat(document.getElementById('macroInterval').value)||0;let li=parseFloat(document.getElementById('loopInterval').value)||0;if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'play_list',macros:macroList,loops:l,macroInterval:mi,loopInterval:li}));}
function stopAll(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'stop'}));if(recording)toggleRec();}
function connectSwitch(){
  send({type:'connect',mac:''});
  const s=document.getElementById('status');s.textContent='连接/搜索中...';s.className='status wait';
}
function disconnectSwitch(){send({type:'disconnect'});const s=document.getElementById('status');s.textContent='断开中...';s.className='status wait';}
function reconnect(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'reconnect'}));const s=document.getElementById('status');s.textContent='重连中';s.className='status wait';}
function clearMacro(){macro=[];document.getElementById('rec-count').textContent='0 事件';}
function saveMacro(){const n=prompt('文件名','macro.json');if(!n)return;const b=new Blob([JSON.stringify(macro)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();}
function loadMacro(){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=e=>{const r=new FileReader();r.onload=()=>{macro=JSON.parse(r.result);document.getElementById('rec-count').textContent=macro.length+' 事件';};r.readAsText(e.target.files[0]);};f.click();}
function renderList(){document.getElementById('list-count').textContent='列表'+macroList.length;document.getElementById('macro-list').innerHTML=macroList.map((m,i)=>'<div class="macro-item"><span>宏'+(i+1)+': '+m.length+'事件</span><button onclick="removeFromList('+i+')">删</button></div>').join('')||'<div style="color:#555;padding:6px">空</div>';}
function addToList(){if(macro.length){macroList.push(macro.slice());renderList();}}
function clearList(){macroList=[];renderList();}
function removeFromList(i){macroList.splice(i,1);renderList();}
function btnOpts(s){return SWITCH_BTNS.map(b=>'<option value="'+b+'" '+(b===s?'selected':'')+'>'+b+'</option>').join('');}
function renderKeyMap(){document.getElementById('keymap-table').innerHTML=Object.entries(keyMap).map(([k,v])=>'<div class="map-item"><span>'+k+'</span><select onchange="keyMap[\''+k+'\']=this.value">'+btnOpts(v)+'</select><button onclick="delete keyMap[\''+k+'\'];renderKeyMap()">删</button></div>').join('')||'<div style="color:#555;padding:6px">空</div>';}
function renderGpMap(){document.getElementById('gpmap-table').innerHTML=Object.entries(gpMap).map(([k,v])=>'<div class="map-item"><span style="min-width:30px">'+k+'</span><select onchange="gpMap[\''+k+'\']=this.value">'+btnOpts(v)+'</select><button onclick="delete gpMap[\''+k+'\'];renderGpMap()">删</button></div>').join('')||'<div style="color:#555;padding:6px">空</div>';}
function addKeyMap(){const k=prompt('键盘code(如KeyA)');if(k){keyMap[k]='a';renderKeyMap();}}
function addGpMap(){const k=prompt('手柄索引(0-15)');if(k!==null){gpMap[k]='a';renderGpMap();}}
function syncMaps(){try{const c=JSON.parse(document.getElementById('mapcfg').value);keyMap=c.keyboard||{};gpMap=c.gamepad||{};renderKeyMap();renderGpMap();renderBindings();renderStickBinds();}catch(e){alert('JSON错误');}}
try{const c=JSON.parse(document.getElementById('mapcfg').value);keyMap=c.keyboard||{};gpMap=c.gamepad||{};}catch(e){}
renderList();renderKeyMap();renderGpMap();
document.addEventListener('keydown',e=>{if(mode!=='keyboard')return;if(pendingBind){keyMap[e.code]=pendingBind;renderBindings();renderKeyMap();pendingBind=null;renderBindings();e.preventDefault();return;}pressedKeys[e.code]=true;var isStick=false;for(var sk in stickKeyMap){for(var d in stickKeyMap[sk]){if(stickKeyMap[sk][d]===e.code)isStick=true;}}if(isStick){updateStickFromKeys();e.preventDefault();return;}const n=keyMap[e.code];if(n){btn(n,1);e.preventDefault();}});
document.addEventListener('keyup',e=>{if(mode!=='keyboard')return;delete pressedKeys[e.code];var isStick=false;for(var sk in stickKeyMap){for(var d in stickKeyMap[sk]){if(stickKeyMap[sk][d]===e.code)isStick=true;}}if(isStick){updateStickFromKeys();e.preventDefault();return;}const n=keyMap[e.code];if(n){btn(n,0);e.preventDefault();}});
window.addEventListener('blur',()=>{pressedKeys={};for(var sk in stickKeyMap){if(stickMouse!==sk)send({type:'stick',stick:sk,h:0,v:0});}});
let lastL='',lastR='';
function gpLoop(){if(mode==='gamepad'){const gp=navigator.getGamepads()[0];if(gp){gp.buttons.forEach((b,i)=>{const p=b.pressed;if(pendingBind&&p&&!gpPrev[i]){gpMap[i]=pendingBind;renderGpMap();renderBindings();pendingBind=null;gpPrev[i]=true;}else if(gpMap[i]&&p!==gpPrev[i]){btn(gpMap[i],p?1:0);gpPrev[i]=p;}});if(listeningStick){
      var active=[];
      for(var ai=0;ai<gp.axes.length;ai++){
        if(Math.abs(gp.axes[ai])>0.5)active.push(ai);
      }
      if(active.length>=2){
        stickAxes[listeningStick]={x:active[0],y:active[1]};
        listeningStick=null;
        renderStickBinds();
      }
    }
    var lx=gp.axes[stickAxes.left.x]||0,ly=gp.axes[stickAxes.left.y]||0,rx=gp.axes[stickAxes.right.x]||0,ry=gp.axes[stickAxes.right.y]||0;const lh=Math.abs(lx)>0.1?lx:0,lv=Math.abs(ly)>0.1?ly:0,rh=Math.abs(rx)>0.1?rx:0,rv=Math.abs(ry)>0.1?ry:0;const ls=lh.toFixed(2)+','+lv.toFixed(2),rs=rh.toFixed(2)+','+rv.toFixed(2);if(ls!==lastL){send({type:'stick',stick:'left',h:lh,v:-lv});lastL=ls;}if(rs!==lastR){send({type:'stick',stick:'right',h:rh,v:-rv});lastR=rs;}}}requestAnimationFrame(gpLoop);}
requestAnimationFrame(gpLoop);
function setupStick(el,knob,stick){let drag=false;const h=(cx,cy)=>{const r=el.getBoundingClientRect();let x=(cx-r.left-r.width/2)/(r.width/2);let y=(cy-r.top-r.height/2)/(r.height/2);const m=Math.sqrt(x*x+y*y);if(m>1){x/=m;y/=m;}knob.style.left=(35+x*26)+'px';knob.style.top=(35+y*26)+'px';send({type:'stick',stick:stick,h:x,v:-y});};const reset=()=>{knob.style.left='35px';knob.style.top='35px';send({type:'stick',stick:stick,h:0,v:0});};el.addEventListener('mousedown',e=>{drag=true;h(e.clientX,e.clientY);});document.addEventListener('mousemove',e=>{if(drag)h(e.clientX,e.clientY);});document.addEventListener('mouseup',()=>{if(drag){drag=false;reset();}});el.addEventListener('touchstart',e=>{drag=true;h(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();});el.addEventListener('touchmove',e=>{if(drag)h(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();});el.addEventListener('touchend',()=>{drag=false;reset();});}
setupStick(document.getElementById('lstick'),document.getElementById('lknob'),'left');
setupStick(document.getElementById('rstick'),document.getElementById('rknob'),'right');
window.addEventListener('gamepadconnected',(e)=>{var s=document.getElementById('status');s.textContent='手柄已连接: '+e.gamepad.id;s.className='status ok';});
window.addEventListener('gamepaddisconnected',()=>{var s=document.getElementById('status');s.textContent='已连接';s.className='status ok';});
</script>
</body>
